<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Colours mirror the accent tokens in src/styles/global.css. -->
  <style>
    :root {
      --lit: #4ea78c;
      --core: #1f6f5c;
      --shade: #12463a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --lit: #a3d6c3;
        --core: #7fbfa8;
        --shade: #3d7a68;
      }
    }
  </style>
  <defs>
    <radialGradient id="sphere" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="var(--lit)" />
      <stop offset="55%" stop-color="var(--core)" />
      <stop offset="100%" stop-color="var(--shade)" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="14.5" fill="url(#sphere)" />
</svg>
